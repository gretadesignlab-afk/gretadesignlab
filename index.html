<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Greta Design Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #f3eee6;
      --burgundy: #641426;
      --black: #171313;
      --pink: #cda7ad;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--black);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ========================================
       MACCHIA INTERATTIVA
       ======================================== */

    .macchia {
      position: fixed;

      width: 250px;
      height: 200px;

      left: 50%;
      top: 50%;

      pointer-events: none;
      z-index: 0;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          ellipse at center,
          rgba(100, 20, 38, 0.22) 0%,
          rgba(100, 20, 38, 0.13) 42%,
          rgba(100, 20, 38, 0.05) 70%,
          rgba(100, 20, 38, 0) 100%
        );

      border-radius: 50%;

      filter: blur(12px);

      opacity: 0.9;
    }


    /* ========================================
       NAVBAR
       ======================================== */

    .navbar {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 90px;

      padding: 20px 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 20;

      background: rgba(243, 238, 230, 0.82);

      backdrop-filter: blur(10px);
    }

    .nav-logo {
      width: 68px;
      height: 68px;

      object-fit: contain;

      transition: transform 0.3s ease;
    }

    .nav-logo:hover {
      transform: scale(1.04);
    }

    .nav-links {
      display: flex;
      align-items: center;

      gap: 38px;
    }

    .nav-links a {
      position: relative;

      text-decoration: none;

      color: var(--black);

      font-size: 10px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      transition:
        color 0.3s ease,
        opacity 0.3s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -8px;

      width: 0;
      height: 1px;

      background: var(--burgundy);

      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--burgundy);
    }

    .nav-links a:hover::after {
      width: 100%;
    }


    /* ========================================
       HERO
       ======================================== */

    .hero {
      position: relative;

      min-height: 100vh;

      padding: 150px 7vw 90px;

      display: flex;
      align-items: center;

      overflow: hidden;
    }

    .hero-inner {
      position: relative;

      width: 100%;
      max-width: 1400px;

      margin: 0 auto;

      z-index: 2;
    }


    /* ========================================
       PICCOLO INTRO
       ======================================== */

    .hero-label {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 38px;

      font-size: 9px;

      letter-spacing: 0.28em;

      text-transform: uppercase;

      color: var(--black);

      opacity: 0.58;
    }

    .hero-label::before {
      content: "";

      width: 38px;
      height: 1px;

      background: var(--burgundy);
    }


    /* ========================================
       TITOLO PRINCIPALE
       ======================================== */

    .hero-title {
      font-family: "Bodoni Moda", Georgia, serif;

      font-size: clamp(
        70px,
        11vw,
        155px
      );

      font-weight: 500;

      line-height: 0.78;

      letter-spacing: -0.055em;

      color: var(--burgundy);

      max-width: 1100px;
    }

    .hero-title .line-two {
      padding-left: 12vw;
    }

    .hero-title .line-three {
      color: var(--black);

      padding-left: 4vw;
    }


    /* ========================================
       SLOGAN
       ======================================== */

    .hero-slogan {
      margin-top: 65px;

      margin-left: 31vw;

      max-width: 390px;

      font-family: "Bodoni Moda", Georgia, serif;

      font-size: clamp(
        20px,
        2.4vw,
        30px
      );

      line-height: 1.3;

      font-style: italic;

      color: var(--black);
    }

    .hero-slogan span {
      color: var(--burgundy);
    }


    /* ========================================
       INFO FINALE
       ======================================== */

    .hero-footer {
      margin-top: 65px;

      margin-left: 31vw;

      font-size: 9px;

      letter-spacing: 0.25em;

      text-transform: uppercase;

      color: var(--black);

      opacity: 0.52;
    }


    /* ========================================
       DETTAGLI GRAFICI
       ======================================== */

    .graphic-line {
      position: absolute;

      background: var(--burgundy);

      opacity: 0.35;
    }

    .line-horizontal {
      width: 120px;
      height: 1px;

      right: 7%;
      top: 31%;
    }

    .line-vertical {
      width: 1px;
      height: 90px;

      right: 12%;
      top: 22%;
    }

    .dot {
      position: absolute;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--burgundy);

      opacity: 0.65;
    }

    .dot-one {
      right: 6%;
      top: 31%;
    }

    .dot-two {
      right: 8%;
      top: 34%;
      width: 3px;
      height: 3px;
    }

    .dot-three {
      left: 5%;
      bottom: 15%;

      width: 4px;
      height: 4px;
    }


    /* ========================================
       NUMERO EDITORIALE
       ======================================== */

    .hero-number {
      position: absolute;

      right: 5%;
      bottom: 9%;

      font-family: "Bodoni Moda", Georgia, serif;

      font-size: 16px;

      color: var(--burgundy);

      opacity: 0.65;

      letter-spacing: 0.08em;
    }


    /* ========================================
       RESPONSIVE TABLET
       ======================================== */

    @media (max-width: 900px) {

      .navbar {
        padding: 18px 28px;
      }

      .nav-logo {
        width: 58px;
        height: 58px;
      }

      .nav-links {
        gap: 24px;
      }

      .hero {
        padding-left: 6vw;
        padding-right: 6vw;
      }

      .hero-title {
        font-size: clamp(
          62px,
          12vw,
          105px
        );
      }

      .hero-slogan,
      .hero-footer {
        margin-left: 25vw;
      }

    }


    /* ========================================
       RESPONSIVE TELEFONO
       ======================================== */

    @media (max-width: 600px) {

      .navbar {
        height: 72px;

        padding: 14px 20px;
      }

      .nav-logo {
        width: 48px;
        height: 48px;
      }

      .nav-links {
        gap: 13px;
      }

      .nav-links a {
        font-size: 7px;
        letter-spacing: 0.08em;
      }

      .hero {
        min-height: 100vh;

        padding:
          115px
          22px
          70px;
      }

      .hero-label {
        font-size: 7px;

        letter-spacing: 0.2em;

        margin-bottom: 30px;
      }

      .hero-title {
        font-size: clamp(
          53px,
          16vw,
          78px
        );

        line-height: 0.82;
      }

      .hero-title .line-two {
        padding-left: 8vw;
      }

      .hero-title .line-three {
        padding-left: 3vw;
      }

      .hero-slogan {
        margin-top: 45px;

        margin-left: 18vw;

        font-size: 19px;
      }

      .hero-footer {
        margin-top: 45px;

        margin-left: 18vw;

        font-size: 7px;
      }

      .line-horizontal {
        width: 60px;

        right: 8%;
      }

      .line-vertical {
        height: 55px;

        right: 13%;
      }

      .hero-number {
        right: 7%;
        bottom: 5%;

        font-size: 12px;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================
       MACCHIA
       ====================================== -->

  <div class="macchia"></div>


  <!-- ======================================
       NAVBAR
       ====================================== -->

  <nav class="navbar">

    <a href="#home">

      <img
        class="nav-logo"
        src="IMG-20260904-WA0041.jpg"
        alt="Greta Design Lab"
      >

    </a>


    <div class="nav-links">

      <a href="#home">
        Home
      </a>

      <a href="#portfolio">
        Portfolio
      </a>

      <a href="#chi-sono">
        Chi sono
      </a>

      <a href="#contatti">
        Contatti
      </a>

    </div>

  </nav>


  <!-- ======================================
       HERO
       ====================================== -->

  <main
    id="home"
    class="hero"
  >

    <div class="hero-inner">


      <div class="hero-label">
        Graphic & Creative Studio
      </div>


      <h1 class="hero-title">

        <span>
          GRETA
        </span>

        <br>

        <span class="line-two">
          DESIGN
        </span>

        <br>

        <span class="line-three">
          LAB.
        </span>

      </h1>


      <p class="hero-slogan">

        Anche la perfezione lascia una
        <span>macchia.</span>

      </p>


      <p class="hero-footer">

        Graphic · Creative · Visual Design

      </p>

    </div>


    <!-- DETTAGLI -->

    <span
      class="graphic-line line-horizontal">
    </span>

    <span
      class="graphic-line line-vertical">
    </span>


    <span class="dot dot-one"></span>

    <span class="dot dot-two"></span>

    <span class="dot dot-three"></span>


    <div class="hero-number">
      01 / 04
    </div>

  </main>


  <!-- ======================================
       MACCHIA SCRIPT
       ====================================== -->

  <script>

    const macchia =
      document.querySelector(".macchia");


    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;


    let macchiaX =
      mouseX;

    let macchiaY =
      mouseY;


    document.addEventListener(
      "pointermove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;

      }
    );


    function animaMacchia() {

      macchiaX +=
        (mouseX - macchiaX) * 0.06;

      macchiaY +=
        (mouseY - macchiaY) * 0.06;


      macchia.style.left =
        macchiaX + "px";

      macchia.style.top =
        macchiaY + "px";


      requestAnimationFrame(
        animaMacchia
      );

    }


    animaMacchia();

  </script>


</body>
</html>
