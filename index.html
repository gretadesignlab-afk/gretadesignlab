<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Greta Design Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #f3eee6;
      --burgundy: #641426;
      --black: #171313;
      --pink: #cda7ad;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--black);
      font-family: "Inter", Arial, sans-serif;
      overflow-x: hidden;
      cursor: none;
    }


    /* ================================
       CURSORE
       ================================ */

    .cursor {
      position: fixed;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: var(--burgundy);

      pointer-events: none;

      z-index: 100;

      transform: translate(-50%, -50%);

      transition:
        width 0.25s ease,
        height 0.25s ease,
        background 0.25s ease;
    }

    .cursor.active {
      width: 28px;
      height: 28px;

      background: transparent;

      border: 1px solid var(--burgundy);
    }


    /* ================================
       MACCHIA
       ================================ */

    .macchia {
      position: fixed;

      width: 250px;
      height: 200px;

      left: 50%;
      top: 50%;

      pointer-events: none;

      z-index: 0;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          ellipse at center,
          rgba(100, 20, 38, 0.23) 0%,
          rgba(100, 20, 38, 0.14) 42%,
          rgba(100, 20, 38, 0.05) 70%,
          rgba(100, 20, 38, 0) 100%
        );

      border-radius: 50%;

      filter: blur(12px);
    }


    /* ================================
       NAVBAR
       ================================ */

    .navbar {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 92px;

      padding: 18px 48px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      z-index: 20;

      background: rgba(243, 238, 230, 0.84);

      backdrop-filter: blur(10px);
    }

    .nav-logo {
      width: 86px;
      height: 86px;

      object-fit: contain;

      transition:
        transform 0.35s ease;
    }

    .nav-logo:hover {
      transform:
        rotate(-2deg)
        scale(1.05);
    }

    .nav-links {
      display: flex;

      align-items: center;

      gap: 38px;
    }

    .nav-links a {
      position: relative;

      text-decoration: none;

      color: var(--black);

      font-family: "Inter", Arial, sans-serif;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      transition:
        color 0.3s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -8px;

      width: 0;
      height: 1px;

      background: var(--burgundy);

      transition:
        width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--burgundy);
    }

    .nav-links a:hover::after {
      width: 100%;
    }


    /* ================================
       HERO
       ================================ */

    .hero {
      position: relative;

      min-height: 100vh;

      padding:
        150px
        7vw
        90px;

      display: flex;

      align-items: center;

      overflow: hidden;
    }

    .hero-inner {
      position: relative;

      width: 100%;

      max-width: 1450px;

      margin: 0 auto;

      z-index: 2;
    }


    /* ================================
       PICCOLO TESTO SUPERIORE
       ================================ */

    .hero-label {
      display: flex;

      align-items: center;

      gap: 14px;

      margin-bottom: 38px;

      font-family: "Inter", Arial, sans-serif;

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 0.25em;

      text-transform: uppercase;

      color: var(--black);

      opacity: 0.58;
    }

    .hero-label::before {
      content: "";

      width: 42px;
      height: 1px;

      background: var(--burgundy);
    }


    /* ================================
       GRETA DESIGN LAB
       ================================ */

    .hero-title {
      font-family:
        "DM Serif Display",
        Georgia,
        serif;

      font-size:
        clamp(
          72px,
          11vw,
          155px
        );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -0.035em;

      color: var(--burgundy);

      max-width: 1100px;
    }

    .hero-title .word {
      display: block;

      width: fit-content;

      transition:
        transform 0.45s cubic-bezier(.2,.8,.2,1),
        color 0.3s ease;
    }

    .hero-title .greta {
      margin-left: 0;
    }

    .hero-title .design {
      margin-left: 12vw;

      margin-top: 12px;
    }

    .hero-title .lab {
      margin-left: 25vw;

      margin-top: 18px;

      color: var(--black);
    }

    .hero-title .word:hover {
      transform: translateX(14px);
    }

    .hero-title .lab:hover {
      color: var(--burgundy);
    }


    /* ================================
       SLOGAN
       ================================ */

    .hero-slogan {
      margin-top: 62px;

      margin-left: 46vw;

      max-width: 380px;

      font-family:
        "DM Serif Display",
        Georgia,
        serif;

      font-size:
        clamp(
          19px,
          2.2vw,
          28px
        );

      line-height: 1.35;

      color: var(--black);

      transition:
        transform 0.5s ease;
    }

    .hero-slogan span {
      color: var(--burgundy);

      font-style: italic;
    }

    .hero-slogan:hover {
      transform: translateX(8px);
    }


    /* ================================
       PAROLE INTERATTIVE
       ================================ */

    .floating-word {
      position: absolute;

      font-family: "Inter", Arial, sans-serif;

      font-size: 9px;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: var(--burgundy);

      opacity: 0.5;

      transition:
        transform 0.4s ease,
        opacity 0.3s ease;
    }

    .floating-word:hover {
      opacity: 1;

      transform:
        translateY(-8px)
        rotate(-2deg);
    }

    .word-idea {
      right: 10%;
      top: 28%;
    }

    .word-forma {
      right: 5%;
      bottom: 25%;
    }

    .word-identita {
      left: 5%;
      bottom: 16%;
    }


    /* ================================
       LINEE DI COSTRUZIONE
       ================================ */

    .construction-line {
      position: absolute;

      background: var(--burgundy);

      opacity: 0.3;

      transition:
        transform 0.6s ease,
        opacity 0.4s ease;
    }

    .construction-horizontal {
      width: 130px;
      height: 1px;

      right: 7%;
      top: 30%;
    }

    .construction-vertical {
      width: 1px;
      height: 100px;

      right: 12%;
      top: 19%;
    }

    .construction-horizontal:hover {
      transform: scaleX(1.4);

      opacity: 0.7;
    }


    /* ================================
       PICCOLE MACCHIE
       ================================ */

    .ink-dot {
      position: absolute;

      border-radius: 50%;

      background: var(--burgundy);

      opacity: 0.45;

      transition:
        transform 0.5s ease,
        opacity 0.3s ease;
    }

    .ink-dot:hover {
      transform: scale(2.5);

      opacity: 0.8;
    }

    .ink-one {
      right: 8%;
      top: 31%;

      width: 6px;
      height: 6px;
    }

    .ink-two {
      right: 10%;
      top: 35%;

      width: 3px;
      height: 3px;
    }

    .ink-three {
      left: 7%;
      bottom: 18%;

      width: 5px;
      height: 5px;
    }


    /* ================================
       TABLET
       ================================ */

    @media (max-width: 900px) {

      .navbar {
        padding: 15px 28px;
      }

      .nav-logo {
        width: 68px;
        height: 68px;
      }

      .nav-links {
        gap: 23px;
      }

      .hero {
        padding-left: 6vw;
        padding-right: 6vw;
      }

      .hero-title {
        font-size:
          clamp(
            65px,
            12vw,
            110px
          );
      }

      .hero-title .design {
        margin-left: 10vw;
      }

      .hero-title .lab {
        margin-left: 20vw;
      }

      .hero-slogan {
        margin-left: 38vw;
      }

    }


    /* ================================
       TELEFONO
       ================================ */

    @media (max-width: 600px) {

      body {
        cursor: auto;
      }

      .cursor {
        display: none;
      }

      .navbar {
        height: 72px;

        padding: 10px 18px;
      }

      .nav-logo {
        width: 52px;
        height: 52px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a {
        font-size: 7px;

        letter-spacing: 0.08em;
      }

      .hero {
        min-height: 100vh;

        padding:
          115px
          22px
          70px;
      }

      .hero-label {
        font-size: 7px;

        letter-spacing: 0.18em;

        margin-bottom: 30px;
      }

      .hero-title {
        font-size:
          clamp(
            54px,
            17vw,
            82px
          );

        line-height: 0.88;
      }

      .hero-title .design {
        margin-left: 7vw;

        margin-top: 8px;
      }

      .hero-title .lab {
        margin-left: 15vw;

        margin-top: 13px;
      }

      .hero-slogan {
        margin-top: 45px;

        margin-left: 18vw;

        font-size: 18px;
      }

      .floating-word {
        font-size: 7px;
      }

      .word-idea {
        right: 7%;
        top: 24%;
      }

      .word-forma {
        right: 6%;
        bottom: 22%;
      }

      .word-identita {
        left: 7%;
        bottom: 13%;
      }

      .construction-horizontal {
        width: 65px;
      }

      .construction-vertical {
        height: 60px;
      }

    }

  </style>
</head>


<body>


  <!-- CURSORE -->

  <div class="cursor"></div>


  <!-- MACCHIA INTERATTIVA -->

  <div class="macchia"></div>


  <!-- NAVBAR -->

  <nav class="navbar">

    <a href="#home">

      <img
        class="nav-logo"
        src="IMG-20260904-WA0041.jpg"
        alt="Greta Design Lab"
      >

    </a>


    <div class="nav-links">

      <a href="#home">
        Home
      </a>

      <a href="#portfolio">
        Portfolio
      </a>

      <a href="#chi-sono">
        Chi sono
      </a>

      <a href="#contatti">
        Contatti
      </a>

    </div>

  </nav>


  <!-- HERO -->

  <main
    id="home"
    class="hero"
  >

    <div class="hero-inner">


      <div class="hero-label">
        Un laboratorio di idee
      </div>


      <h1 class="hero-title">

        <span class="word greta">
          GRETA
        </span>

        <span class="word design">
          DESIGN
        </span>

        <span class="word lab">
          LAB.
        </span>

      </h1>


      <p class="hero-slogan">

        Anche la perfezione lascia una
        <span>macchia.</span>

      </p>

    </div>


    <!-- PAROLE INTERATTIVE -->

    <span class="floating-word word-idea">
      IDEA
    </span>

    <span class="floating-word word-forma">
      FORMA
    </span>

    <span class="floating-word word-identita">
      IDENTITÀ
    </span>


    <!-- LINEE -->

    <span
      class="construction-line construction-horizontal">
    </span>

    <span
      class="construction-line construction-vertical">
    </span>


    <!-- PICCOLE MACCHIE -->

    <span class="ink-dot ink-one"></span>

    <span class="ink-dot ink-two"></span>

    <span class="ink-dot ink-three"></span>

  </main>


  <!-- JAVASCRIPT -->

  <script>

    /* ================================
       MACCHIA
       ================================ */

    const macchia =
      document.querySelector(".macchia");

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let macchiaX =
      mouseX;

    let macchiaY =
      mouseY;


    document.addEventListener(
      "pointermove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;

      }
    );


    function animaMacchia() {

      macchiaX +=
        (mouseX - macchiaX) * 0.065;

      macchiaY +=
        (mouseY - macchiaY) * 0.065;


      macchia.style.left =
        macchiaX + "px";

      macchia.style.top =
        macchiaY + "px";


      requestAnimationFrame(
        animaMacchia
      );

    }

    animaMacchia();


    /* ================================
       CURSORE
       ================================ */

    const cursor =
      document.querySelector(".cursor");


    document.addEventListener(
      "pointermove",
      (event) => {

        cursor.style.left =
          event.clientX + "px";

        cursor.style.top =
          event.clientY + "px";

      }
    );


    const interactiveElements =
      document.querySelectorAll(
        "a, .word, .floating-word, .ink-dot, .construction-horizontal, .hero-slogan"
      );


    interactiveElements.forEach(
      (element) => {

        element.addEventListener(
          "mouseenter",
          () => {

            cursor.classList.add("active");

          }
        );


        element.addEventListener(
          "mouseleave",
          () => {

            cursor.classList.remove("active");

          }
        );

      }
    );

  </script>


</body>
</html>
